<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eye Tracking Results Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css_files/eye_tracking.css') }}">
</head>
<body>
    <div class="et-main-layout">
        <aside class="et-sidebar">
            <div class="et-sidebar-header">
                Eye Tracking Results – Select an image to view its heatmap
            </div>

            <ul class="et-image-list">
                {% for img in processed_images %}
                <li class="{% if img == selected_image %}selected{% endif %}">
                    <form method="get" action="{{ url_for('eye_tracking_results') }}">
                        <input type="hidden" name="image" value="{{ img }}">
                        <button type="submit" class="et-image-btn" {% if img == selected_image %} disabled {% endif %}>
                            ▶
                        </button>
                        <span class="et-image-label">{{ img }}</span>
                    </form>
                </li>
                {% endfor %}
            </ul>

            <div class="et-sidebar-footer">
                <a href="{{ url_for('calibration_page') }}" class="et-nav-button">Calibration Page</a>
                <a href="{{ url_for('eye_tracking_page') }}" class="et-nav-button">Eye Tracking Page</a>
            </div>
        </aside>

        <div class="et-content-frame">
            <img src="{{ url_for('gaze_heatmap_cached', image=selected_image) }}" class="et-content-image">
        </div>
    </div>
</body>
</html>
